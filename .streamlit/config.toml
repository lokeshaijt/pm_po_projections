# Brand theme taken from the JAY logo: off-black, one gold accent, warm neutrals.
[theme]
base = "light"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap, monospace"
primaryColor = "#D6A21E"
backgroundColor = "#FAF8F3"
secondaryBackgroundColor = "#F2EDE1"
textColor = "#1B1915"
linkColor = "#7A5A08"
borderColor = "#000000"
dataframeHeaderBackgroundColor = "#FFF3C4"
baseRadius = "0.6rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#14130F"
secondaryBackgroundColor = "#24221C"
textColor = "#F3EFE4"
borderColor = "#3B382F"
linkColor = "#E8B93A"
